<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🏰 王国保卫战 · 女弓箭手</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#1a1410;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  canvas{display:block;position:absolute;top:0;left:0;}

  #topUI{position:absolute;top:0;left:0;right:0;padding:8px 12px;z-index:10;
    display:flex;gap:8px;align-items:center;pointer-events:none;
    color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.9);font-size:13px;font-weight:bold;}
  .stat{display:flex;align-items:center;gap:4px;background:linear-gradient(135deg,rgba(0,0,0,.7),rgba(30,20,10,.7));
    padding:4px 10px;border-radius:20px;border:1px solid rgba(255,215,0,.4);}
  .spacer{flex:1;}
  .ctrl-btn{pointer-events:auto;width:40px;height:40px;border-radius:50%;
    background:linear-gradient(135deg,#3a2820,#1a1410);color:#ffd700;font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    border:2px solid #b8860b;box-shadow:0 2px 8px rgba(0,0,0,.6);transition:transform .1s;}
  .ctrl-btn:active{transform:scale(.9);}
  .ctrl-btn.active{background:linear-gradient(135deg,#ffd700,#c9a000);color:#2c1810;}

  #bottomBar{position:absolute;bottom:0;left:0;right:0;z-index:10;
    display:flex;flex-direction:column;gap:6px;padding:8px 6px 12px;
    background:linear-gradient(to top,rgba(0,0,0,.95),rgba(0,0,0,.5) 70%,transparent);
    pointer-events:none;}
  .bar-row{display:flex;gap:5px;justify-content:center;flex-wrap:nowrap;overflow-x:auto;padding:0 4px;pointer-events:auto;}
  .bar-row::-webkit-scrollbar{display:none;}

  .unit-btn{flex:0 0 auto;width:58px;height:62px;border-radius:10px;
    background:linear-gradient(180deg,#8b6f47,#5d4037);border:2px solid #b8860b;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;font-size:9px;font-weight:bold;text-shadow:0 1px 2px #000;
    transition:transform .1s;position:relative;font-family:inherit;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 3px 6px rgba(0,0,0,.6);}
  .unit-btn .ico{font-size:22px;line-height:1;}
  .unit-btn .name{font-size:9px;margin-top:1px;}
  .unit-btn .price{position:absolute;bottom:1px;font-size:9px;color:#ffd700;}
  .unit-btn:active{transform:scale(.93);}
  .unit-btn.selected{border-color:#ffeb3b;box-shadow:0 0 15px #ffd700,inset 0 1px 0 rgba(255,255,255,.3);
    background:linear-gradient(180deg,#a67c52,#7a5a3a);}
  .unit-btn.disabled{opacity:.4;filter:grayscale(0.8);}

  .start-btn{flex:0 0 auto;padding:10px 18px;border-radius:10px;border:2px solid #ffd700;
    background:linear-gradient(180deg,#ffd700,#b8860b);color:#2c1810;
    font-size:13px;font-weight:bold;cursor:pointer;font-family:inherit;
    text-shadow:0 1px 0 rgba(255,255,255,.4);
    box-shadow:0 4px 12px rgba(255,215,0,.4),inset 0 1px 0 rgba(255,255,255,.5);}
  .start-btn:active{transform:scale(.95);}
  .start-btn.hidden{display:none;}

  #joystickWrap{position:fixed;left:20px;bottom:100px;width:130px;height:130px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.05) 0%,rgba(0,0,0,.4) 100%);
    border:2px solid rgba(255,255,255,.25);z-index:20;touch-action:none;
    box-shadow:inset 0 2px 10px rgba(0,0,0,.5),0 4px 12px rgba(0,0,0,.5);}
  #joystickKnob{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:54px;height:54px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#fff,#999);
    box-shadow:0 2px 8px rgba(0,0,0,.6);pointer-events:none;}
  #joystickWrap::after{content:'移动';position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);
    font-size:10px;color:rgba(255,255,255,.5);letter-spacing:2px;white-space:nowrap;}

  #skillBar{position:fixed;right:20px;bottom:180px;z-index:20;
    display:flex;flex-direction:column;gap:10px;align-items:flex-end;}
  .skill-btn{width:70px;height:70px;border-radius:50%;
    background:linear-gradient(180deg,#7b1fa2,#4a148c);border:3px solid #ce93d8;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;font-size:9px;font-weight:bold;text-shadow:0 1px 2px #000;
    transition:transform .1s;position:relative;overflow:hidden;font-family:inherit;
    box-shadow:0 4px 12px rgba(123,31,162,.6),inset 0 2px 0 rgba(255,255,255,.3);}
  .skill-btn .ico{font-size:24px;line-height:1;}
  .skill-btn .lbl{font-size:10px;margin-top:2px;}
  .skill-btn:active{transform:scale(.9);}
  .skill-btn.cooling{filter:grayscale(0.85);opacity:0.7;}
  .skill-btn .cdMask{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);
    pointer-events:none;transition:height .1s linear;}
  .skill-btn .cdText{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    font-size:14px;font-weight:bold;color:#fff;text-shadow:0 1px 2px #000;
    pointer-events:none;display:none;}
  .skill-btn.cooling .cdText{display:block;}

  #banner{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);
    color:#fff;font-size:28px;font-weight:bold;
    text-shadow:0 0 20px #ff8c00,0 0 40px #ff4500,0 4px 8px #000;
    z-index:50;text-align:center;pointer-events:none;display:none;letter-spacing:3px;}
  #banner.show{display:block;animation:bannerAnim 1.8s ease-out;}
  @keyframes bannerAnim{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.5);}
    20%{opacity:1;transform:translate(-50%,-50%) scale(1.1);}
    75%{opacity:1;transform:translate(-50%,-50%) scale(1);}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.3);}}

  #pauseOverlay{position:absolute;inset:0;background:rgba(0,0,0,.65);
    z-index:40;display:none;align-items:center;justify-content:center;
    color:#ffd700;font-size:36px;font-weight:bold;letter-spacing:8px;
    text-shadow:0 0 30px #ffd700;}
  #pauseOverlay.show{display:flex;}

  #startScreen{position:absolute;inset:0;
    background:radial-gradient(circle at 50% 30%,#4a2a1a 0%,#1a0e08 70%),linear-gradient(135deg,#2c1810,#1a0e08);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:100;color:#fff;text-align:center;padding:20px;}
  #startScreen h1{font-size:30px;margin-bottom:6px;color:#ffd700;text-shadow:0 0 30px #ff8c00,0 4px 8px #000;letter-spacing:3px;}
  #startScreen .sub{font-size:13px;color:#c9a875;margin-bottom:30px;letter-spacing:3px;}
  #startBtn{background:linear-gradient(180deg,#ffd700,#b8860b);border:2px solid #fff5b0;
    color:#2c1810;font-size:20px;font-weight:bold;padding:14px 50px;border-radius:14px;
    cursor:pointer;box-shadow:0 6px 25px rgba(255,215,0,.6),inset 0 2px 0 rgba(255,255,255,.5);
    font-family:inherit;letter-spacing:2px;}
  #startBtn:active{transform:scale(.96);}
  .hint{margin-top:30px;font-size:11px;color:#8b7355;line-height:1.9;text-align:left;}
  .hint b{color:#ffd700;}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="topUI">
  <div class="stat">❤️ <span id="hpText">20</span></div>
  <div class="stat">💰 <span id="goldText">300</span></div>
  <div class="stat">🌊 <span id="waveText">0/15</span></div>
  <div class="spacer"></div>
  <button class="ctrl-btn" id="pauseBtn" title="暂停">⏸</button>
  <button class="ctrl-btn" id="restartBtn" title="重来">🔄</button>
</div>

<div id="bottomBar">
  <div class="bar-row" id="unitRow">
    <button class="unit-btn" data-type="archer">
      <div class="ico">🏹</div><div class="name">弓箭手</div><div class="price">50</div>
    </button>
    <button class="unit-btn" data-type="mage">
      <div class="ico">🔮</div><div class="name">法师</div><div class="price">80</div>
    </button>
    <button class="unit-btn" data-type="cannon">
      <div class="ico">💣</div><div class="name">炮台</div><div class="price">120</div>
    </button>
    <button class="unit-btn" data-type="barracks">
      <div class="ico">🏰</div><div class="name">兵营</div><div class="price">70</div>
    </button>
    <button class="start-btn" id="startWaveBtn">开始第1波</button>
  </div>
</div>

<div id="joystickWrap">
  <div id="joystickKnob"></div>
</div>

<div id="skillBar">
  <button class="skill-btn" id="fartBtn">
    <div class="ico">💨</div><div class="lbl">臭屁</div>
    <div class="cdMask"></div><div class="cdText"></div>
  </button>
  <button class="skill-btn" id="roarBtn">
    <div class="ico">🦁</div><div class="lbl">狮子吼</div>
    <div class="cdMask"></div><div class="cdText"></div>
  </button>
</div>

<div id="banner"></div>
<div id="pauseOverlay">暂停中</div>

<div id="startScreen">
  <h1>🏰 王国保卫战</h1>
  <div class="sub">女弓箭手 · 兵营塔防</div>
  <button id="startBtn">开始游戏</button>
  <div class="hint">
    <b>准备阶段</b>：点击炮塔按钮 → 点击地图建造<br>
    <b>女英雄</b>：左下摇杆控制移动，自动射箭<br>
    <b>技能</b>：右下角手点释放 💨 臭屁 / 🦁 狮子吼<br>
    <br>
    🏹 弓箭手 · 单体射击<br>
    🔮 法师 · 魔法穿透<br>
    💣 炮台 · 范围爆炸<br>
    🏰 兵营 · 自动出兵拦截敌人<br>
    <br>
    <b>兵营机制</b>：士兵死后会在兵营倒计时重生
  </div>
</div>

<script>
/* =========================================================
   基础
   ========================================================= */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * window.devicePixelRatio;
  canvas.height = H * window.devicePixelRatio;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
  pathPoints = computePath();
  towerSpots = computeSpots();
  generateDecorations();
}
window.addEventListener('resize', resize);

/* =========================================================
   复杂蛇形路径
   ========================================================= */
let pathPoints = [];
let towerSpots = [];
let decorations = [];

function computePath() {
  return [
    { x: -30, y: H * 0.13 },
    { x: W * 0.22, y: H * 0.13 },
    { x: W * 0.22, y: H * 0.38 },
    { x: W * 0.58, y: H * 0.38 },
    { x: W * 0.58, y: H * 0.16 },
    { x: W * 0.84, y: H * 0.16 },
    { x: W * 0.84, y: H * 0.52 },
    { x: W * 0.36, y: H * 0.52 },
    { x: W * 0.36, y: H * 0.76 },
    { x: W * 0.72, y: H * 0.76 },
    { x: W + 30, y: H * 0.76 }
  ];
}

function computeSpots() {
  const arr = [
    { x: W*0.10, y: H*0.06 },
    { x: W*0.33, y: H*0.06 },
    { x: W*0.66, y: H*0.06 },
    { x: W*0.92, y: H*0.06 },
    { x: W*0.10, y: H*0.26 },
    { x: W*0.42, y: H*0.26 },
    { x: W*0.68, y: H*0.26 },
    { x: W*0.10, y: H*0.46 },
    { x: W*0.48, y: H*0.46 },
    { x: W*0.68, y: H*0.46 },
    { x: W*0.18, y: H*0.62 },
    { x: W*0.52, y: H*0.62 },
    { x: W*0.10, y: H*0.88 },
    { x: W*0.52, y: H*0.88 },
    { x: W*0.86, y: H*0.88 }
  ];
  return arr.map(s => {
    const old = towerSpots.find(o => Math.hypot(o.x - s.x, o.y - s.y) < 5);
    return { ...s, tower: old ? old.tower : null };
  });
}

function generateDecorations() {
  decorations = [];
  const random = (seed) => { let x = Math.sin(seed) * 10000; return x - Math.floor(x); };
  for (let i = 0; i < 30; i++) {
    const x = random(i * 1.1) * W;
    const y = random(i * 2.3) * H;
    if (isNearPath(x, y, 55)) continue;
    if (towerSpots.some(s => Math.hypot(s.x - x, s.y - y) < 50)) continue;
    const type = random(i * 3.7) < 0.45 ? 'tree' : (random(i*4.1) < 0.5 ? 'stone' : 'bush');
    decorations.push({ x, y, type, seed: i, size: 0.7 + random(i*5.5)*0.6 });
  }
}

function isNearPath(x, y, threshold) {
  for (let i = 0; i < pathPoints.length - 1; i++) {
    const p1 = pathPoints[i], p2 = pathPoints[i+1];
    const d = pointToSegmentDistance(x, y, p1.x, p1.y, p2.x, p2.y);
    if (d < threshold) return true;
  }
  return false;
}

function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx*dx + dy*dy;
  if (len2 === 0) return Math.hypot(px - x1, py - y1);
  let t = ((px - x1) * dx + (py - y1) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t*dx), py - (y1 + t*dy));
}

/* =========================================================
   配置
   ========================================================= */
const TOWER_TYPES = {
  archer: { name:'弓箭手', cost:50, color:'#5d4037', accent:'#2e7d32', range:120, damage:14, rate:650, bulletSpeed:650, bulletColor:'#c8e6c9', icon:'🏹' },
  mage:   { name:'法师',   cost:80, color:'#4a148c', accent:'#9c27b0', range:140, damage:32, rate:1400, bulletSpeed:450, bulletColor:'#e1bee7', icon:'🔮' },
  cannon: { name:'炮台',   cost:120, color:'#3e2723', accent:'#ff5722', range:110, damage:55, rate:1900, bulletSpeed:350, bulletColor:'#ffab91', icon:'💣', splash:70 }
};

const BARRACKS = {
  name:'兵营', cost:70,
  color:'#5d4037', accent:'#8d6e63', icon:'🏰',
  respawnTime: 6000,   // 士兵重生时间（毫秒）
  soldierHp: 200,
  soldierDamage: 22,
  soldierChaseRange: 180,   // 追击范围
  soldierAttackRange: 42,   // 攻击范围
  soldierRate: 900,         // 攻击间隔
  soldierSpeed: 2.4
};

function barracksLevelData(level) {
  if (level === 1) return { maxSoldiers: 2, hp: 200, damage: 22, respawnTime: 6000 };
  if (level === 2) return { maxSoldiers: 2, hp: 300, damage: 32, respawnTime: 5500 };
  return { maxSoldiers: 3, hp: 400, damage: 42, respawnTime: 5000 };
}

const HERO = {
  maxHp: 600, speed: 3.5, range: 160, damage: 45, rate: 700,
  fartCd: 8000, roarCd: 20000
};

const ENEMY_TYPES = {
  goblin:{ name:'哥布林', body:'#8bc34a', dark:'#558b2f', size:13, hp:60, speed:75, gold:10, damage:1 },
  orc:   { name:'兽人',   body:'#8d6e63', dark:'#4e342e', size:17, hp:130, speed:55, gold:18, damage:2 },
  troll: { name:'巨魔',   body:'#78909c', dark:'#37474f', size:22, hp:260, speed:42, gold:30, damage:3 },
  demon: { name:'恶魔',   body:'#e91e63', dark:'#880e4f', size:20, hp:420, speed:60, gold:50, damage:4 }
};

/* =========================================================
   状态
   ========================================================= */
const game = {
  phase: 'prepare',
  paused: false,
  gold: 300,
  hp: 20,
  wave: 0,
  maxWaves: 15,
  enemies: [],
  towers: [],       // 攻击型炮塔
  barracks: [],     // 兵营
  bullets: [],
  particles: [],
  effects: [],
  selectedType: null,
  spawnTimer: 0,
  spawnInterval: 1000,
  enemiesToSpawn: 0,
  waveInProgress: false,
  running: false,
  time: 0,
  hero: null
};

const joystick = { active: false, dx: 0, dy: 0 };

function createHero() {
  return {
    x: W * 0.5, y: H * 0.5,
    hp: HERO.maxHp, maxHp: HERO.maxHp,
    angle: -Math.PI / 2, cooldown: 0,
    fartCd: 0, roarCd: 0
  };
}

function createSoldier(barracks) {
  const data = barracksLevelData(barracks.level);
  const angleOffset = barracks.soldiers.length * (Math.PI * 2 / 3);
  const rallyDist = 40;
  return {
    x: barracks.x + Math.cos(angleOffset) * 8,
    y: barracks.y + Math.sin(angleOffset) * 8,
    hp: data.hp,
    maxHp: data.hp,
    angle: Math.PI / 2,
    target: null,
    cooldown: 0,
    rallyX: barracks.x + Math.cos(angleOffset) * rallyDist,
    rallyY: barracks.y + 40 + Math.sin(angleOffset) * 15,
    damage: data.damage,
    hurtFlash: 0
  };
}

/* =========================================================
   UI 更新
   ========================================================= */
function updateUI() {
  document.getElementById('hpText').textContent = Math.max(0, game.hp);
  document.getElementById('goldText').textContent = game.gold;
  document.getElementById('waveText').textContent = `${game.wave}/${game.maxWaves}`;
  document.querySelectorAll('.unit-btn').forEach(btn => {
    const type = btn.dataset.type;
    let cost = 0;
    if (TOWER_TYPES[type]) cost = TOWER_TYPES[type].cost;
    else if (type === 'barracks') cost = BARRACKS.cost;
    if (game.gold < cost) btn.classList.add('disabled');
    else btn.classList.remove('disabled');
  });
}

function showBanner(text) {
  const b = document.getElementById('banner');
  b.textContent = text;
  b.classList.remove('show');
  void b.offsetWidth;
  b.classList.add('show');
}

/* =========================================================
   波次
   ========================================================= */
function startWave() {
  if (game.phase !== 'prepare') return;
  if (game.wave >= game.maxWaves) return;
  game.wave++;
  game.phase = 'battle';
  game.waveInProgress = true;
  game.enemiesToSpawn = 5 + game.wave * 2;
  game.spawnTimer = 0;
  game.spawnInterval = Math.max(400, 1100 - game.wave * 55);
  document.getElementById('startWaveBtn').classList.add('hidden');
  updateUI();
  showBanner(`第 ${game.wave} 波`);
}

function pickEnemyType(wave) {
  const r = Math.random();
  if (wave >= 12) {
    if (r < 0.25) return 'goblin';
    if (r < 0.55) return 'orc';
    if (r < 0.82) return 'troll';
    return 'demon';
  } else if (wave >= 8) {
    if (r < 0.35) return 'goblin';
    if (r < 0.7) return 'orc';
    if (r < 0.92) return 'troll';
    return 'demon';
  } else if (wave >= 4) {
    if (r < 0.5) return 'goblin';
    if (r < 0.9) return 'orc';
    return 'troll';
  }
  return r < 0.7 ? 'goblin' : 'orc';
}

function spawnEnemy() {
  const type = pickEnemyType(game.wave);
  const t = ENEMY_TYPES[type];
  const hpScale = 1 + (game.wave - 1) * 0.16;
  game.enemies.push({
    x: pathPoints[0].x, y: pathPoints[0].y,
    pathIndex: 0, type, hp: t.hp * hpScale, maxHp: t.hp * hpScale,
    speed: t.speed, size: t.size, gold: t.gold, damage: t.damage,
    slowTimer: 0, stunTimer: 0, hitFlash: 0, attackCooldown: 0,
    wobble: Math.random() * Math.PI * 2
  });
}

/* =========================================================
   更新逻辑
   ========================================================= */
function update(dt) {
  if (!game.running || game.paused) return;
  game.time += dt / 1000;

  // 出怪
  if (game.waveInProgress) {
    game.spawnTimer -= dt;
    if (game.spawnTimer <= 0 && game.enemiesToSpawn > 0) {
      spawnEnemy();
      game.enemiesToSpawn--;
      game.spawnTimer = game.spawnInterval;
    }
    if (game.enemiesToSpawn === 0 && game.enemies.length === 0) {
      game.waveInProgress = false;
      game.gold += 30 + game.wave * 8;
      updateUI();
      if (game.wave >= game.maxWaves) {
        setTimeout(() => endGame(true), 500);
      } else {
        game.phase = 'prepare';
        document.getElementById('startWaveBtn').classList.remove('hidden');
        document.getElementById('startWaveBtn').textContent = `开始第${game.wave + 1}波`;
        showBanner('准备阶段');
      }
    }
  }

  // ====== 英雄移动 ======
  if (game.hero && game.hero.hp > 0) {
    const h = game.hero;
    if (joystick.active && (joystick.dx !== 0 || joystick.dy !== 0)) {
      const len = Math.hypot(joystick.dx, joystick.dy);
      h.x += (joystick.dx / len) * HERO.speed * 60 * dt / 1000;
      h.y += (joystick.dy / len) * HERO.speed * 60 * dt / 1000;
    }
    h.x = Math.max(20, Math.min(W - 20, h.x));
    h.y = Math.max(20, Math.min(H - 20, h.y));
  }

  // ====== 兵营更新 ======
  for (const b of game.barracks) {
    // 士兵死亡检测
    for (let i = b.soldiers.length - 1; i >= 0; i--) {
      if (b.soldiers[i].hp <= 0) {
        addParticles(b.soldiers[i].x, b.soldiers[i].y, '#90a4ae', 18);
        b.soldiers.splice(i, 1);
        if (b.respawnTimer <= 0) {
          b.respawnTimer = barracksLevelData(b.level).respawnTime;
        }
      }
    }
    // 士兵重生
    const data = barracksLevelData(b.level);
    if (b.soldiers.length < data.maxSoldiers) {
      if (b.respawnTimer <= 0) {
        b.respawnTimer = data.respawnTime;
      }
      b.respawnTimer -= dt;
      if (b.respawnTimer <= 0) {
        b.soldiers.push(createSoldier(b));
        b.respawnTimer = b.soldiers.length < data.maxSoldiers ? data.respawnTime : 0;
      }
    } else {
      b.respawnTimer = 0;
    }
    // 更新每个士兵
    for (const s of b.soldiers) {
      updateSoldier(s, b, dt);
    }
  }

  // 敌人
  for (let i = game.enemies.length - 1; i >= 0; i--) {
    const e = game.enemies[i];
    if (e.hitFlash > 0) e.hitFlash -= dt;
    if (e.slowTimer > 0) e.slowTimer -= dt;
    if (e.attackCooldown > 0) e.attackCooldown -= dt;
    if (e.stunTimer > 0) { e.stunTimer -= dt; e.wobble += dt * 0.02; continue; }
    e.wobble += dt * 0.008;

    // 检查是否有士兵阻挡
    let blocked = null;
    if (game.hero && game.hero.hp > 0 && Math.hypot(e.x - game.hero.x, e.y - game.hero.y) < e.size + 22) {
      blocked = game.hero;
    }
    if (!blocked) {
      for (const b of game.barracks) {
        for (const s of b.soldiers) {
          if (s.hp <= 0) continue;
          if (Math.hypot(e.x - s.x, e.y - s.y) < e.size + 20) { blocked = s; break; }
        }
        if (blocked) break;
      }
    }

    if (blocked && e.attackCooldown <= 0) {
      e.attackCooldown = 800;
      blocked.hp -= e.damage * 18;
      addParticles(blocked.x, blocked.y, '#ff5722', 6);
      if (blocked.hp <= 0) {
        blocked.hp = 0;
        if (blocked === game.hero) {
          addParticles(blocked.x, blocked.y, '#ec407a', 30);
          game.hero = null;
          showBanner('💀 女英雄倒下了');
        }
      }
      continue;
    }
    if (blocked) continue;

    const speedMul = e.slowTimer > 0 ? 0.45 : 1;
    const target = pathPoints[e.pathIndex + 1];
    if (!target) {
      game.hp -= e.damage;
      game.enemies.splice(i, 1);
      updateUI();
      if (game.hp <= 0) endGame(false);
      continue;
    }
    const dx = target.x - e.x, dy = target.y - e.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const step = (e.speed * speedMul * dt) / 1000;
    if (dist < step) {
      e.x = target.x; e.y = target.y; e.pathIndex++;
    } else {
      e.x += (dx / dist) * step;
      e.y += (dy / dist) * step;
    }
  }

  // 攻击型炮塔
  for (const tower of game.towers) {
    const cfg = TOWER_TYPES[tower.type];
    tower.cooldown -= dt;
    let target = null, minD = Infinity;
    for (const e of game.enemies) {
      const d = Math.hypot(e.x - tower.x, e.y - tower.y);
      if (d < cfg.range && d < minD) { minD = d; target = e; }
    }
    if (target) {
      const desired = Math.atan2(target.y - tower.y, target.x - tower.x);
      let diff = desired - tower.angle;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      tower.angle += diff * 0.15;
      if (tower.cooldown <= 0) {
        tower.cooldown = cfg.rate;
        const bonus = (tower.level - 1) * 0.4;
        game.bullets.push({
          x: tower.x + Math.cos(tower.angle) * 22,
          y: tower.y + Math.sin(tower.angle) * 22,
          target, speed: cfg.bulletSpeed, damage: cfg.damage * (1 + bonus),
          color: cfg.bulletColor, splash: cfg.splash || 0, type: tower.type
        });
      }
    }
  }

  // 英雄自动攻击
  if (game.hero && game.hero.hp > 0) {
    const h = game.hero;
    h.cooldown = Math.max(0, h.cooldown - dt);
    h.fartCd = Math.max(0, h.fartCd - dt);
    h.roarCd = Math.max(0, h.roarCd - dt);
    let target = null, minD = Infinity;
    for (const e of game.enemies) {
      const d = Math.hypot(e.x - h.x, e.y - h.y);
      if (d < HERO.range && d < minD) { minD = d; target = e; }
    }
    if (target) {
      if (!joystick.active || (joystick.dx === 0 && joystick.dy === 0)) {
        h.angle = Math.atan2(target.y - h.y, target.x - h.x);
      }
      if (h.cooldown <= 0) {
        h.cooldown = HERO.rate;
        game.bullets.push({
          x: h.x + Math.cos(h.angle) * 15,
          y: h.y + Math.sin(h.angle) * 15,
          target, speed: 800, damage: HERO.damage,
          color: '#fff8e1', isHero: true
        });
      }
    } else if (joystick.active && (joystick.dx !== 0 || joystick.dy !== 0)) {
      h.angle = Math.atan2(joystick.dy, joystick.dx);
    }
  }

  // 子弹
  for (let i = game.bullets.length - 1; i >= 0; i--) {
    const b = game.bullets[i];
    if (!b.target || b.target.hp <= 0) {
      let closest = null, minD = Infinity;
      for (const e of game.enemies) {
        const d = Math.hypot(e.x - b.x, e.y - b.y);
        if (d < minD) { minD = d; closest = e; }
      }
      if (!closest) { game.bullets.splice(i, 1); continue; }
      b.target = closest;
    }
    const dx = b.target.x - b.x, dy = b.target.y - b.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const step = (b.speed * dt) / 1000;
    if (dist < step + 6) {
      hitEnemy(b.target, b.damage, b.splash);
      addParticles(b.target.x, b.target.y, b.color, 6);
      game.bullets.splice(i, 1);
    } else {
      b.x += (dx / dist) * step;
      b.y += (dy / dist) * step;
    }
  }

  // 粒子
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.x += p.vx * dt / 1000;
    p.y += p.vy * dt / 1000;
    p.vy += 320 * dt / 1000;
    p.life -= dt;
    if (p.life <= 0) game.particles.splice(i, 1);
  }
  for (let i = game.effects.length - 1; i >= 0; i--) {
    const f = game.effects[i];
    f.time += dt;
    if (f.time >= f.duration) game.effects.splice(i, 1);
  }

  // 技能冷却 UI
  if (game.hero) {
    const fartRatio = game.hero.fartCd / HERO.fartCd;
    const roarRatio = game.hero.roarCd / HERO.roarCd;
    const fartBtn = document.getElementById('fartBtn');
    const roarBtn = document.getElementById('roarBtn');
    fartBtn.querySelector('.cdMask').style.height = `${fartRatio * 100}%`;
    roarBtn.querySelector('.cdMask').style.height = `${roarRatio * 100}%`;
    fartBtn.querySelector('.cdText').textContent = Math.ceil(game.hero.fartCd / 1000) + 's';
    roarBtn.querySelector('.cdText').textContent = Math.ceil(game.hero.roarCd / 1000) + 's';
    fartBtn.classList.toggle('cooling', fartRatio > 0);
    roarBtn.classList.toggle('cooling', roarRatio > 0);
  }
}

/* =========================================================
   士兵 AI
   ========================================================= */
function updateSoldier(s, barracks, dt) {
  if (s.hp <= 0) return;
  if (s.hurtFlash > 0) s.hurtFlash -= dt;
  s.cooldown = Math.max(0, s.cooldown - dt);

  // 找追击目标
  let target = null, minD = Infinity;
  for (const e of game.enemies) {
    const d = Math.hypot(e.x - s.x, e.y - s.y);
    if (d < BARRACKS.soldierChaseRange && d < minD) { minD = d; target = e; }
  }

  if (target) {
    s.target = target;
    if (minD < BARRACKS.soldierAttackRange + 5) {
      // 贴身攻击
      s.angle = Math.atan2(target.y - s.y, target.x - s.x);
      if (s.cooldown <= 0) {
        s.cooldown = BARRACKS.soldierRate;
        hitEnemy(target, s.damage, 0);
        addParticles(s.x + Math.cos(s.angle) * 15, s.y + Math.sin(s.angle) * 15, '#fff', 4);
      }
    } else {
      // 追过去
      const dx = target.x - s.x, dy = target.y - s.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      s.x += (dx / dist) * BARRACKS.soldierSpeed * 60 * dt / 1000;
      s.y += (dy / dist) * BARRACKS.soldierSpeed * 60 * dt / 1000;
      s.angle = Math.atan2(dy, dx);
    }
  } else {
    // 回到集结点
    const dx = s.rallyX - s.x, dy = s.rallyY - s.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > 3) {
      s.x += (dx / dist) * BARRACKS.soldierSpeed * 60 * dt / 1000;
      s.y += (dy / dist) * BARRACKS.soldierSpeed * 60 * dt / 1000;
      s.angle = Math.atan2(dy, dx);
    } else {
      s.angle = Math.PI / 2;
    }
  }
}

function hitEnemy(enemy, damage, splash) {
  enemy.hp -= damage;
  enemy.hitFlash = 0.18;
  if (splash > 0) {
    for (const e of game.enemies) {
      if (e === enemy) continue;
      const d = Math.hypot(e.x - enemy.x, e.y - enemy.y);
      if (d < splash) {
        e.hp -= damage * 0.55;
        e.hitFlash = 0.12;
      }
    }
  }
  if (enemy.hp <= 0) {
    const idx = game.enemies.indexOf(enemy);
    if (idx >= 0) {
      game.enemies.splice(idx, 1);
      game.gold += enemy.gold;
      updateUI();
      addParticles(enemy.x, enemy.y, '#ffd700', 16);
    }
  }
}

function addParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    game.particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 350,
      vy: (Math.random() - 0.5) * 350 - 80,
      life: 400 + Math.random() * 300,
      maxLife: 700,
      color, size: 1.5 + Math.random() * 3
    });
  }
}

/* =========================================================
   英雄技能
   ========================================================= */
function useFart() {
  if (!game.hero || game.hero.hp <= 0) return;
  if (game.hero.fartCd > 0) return;
  game.hero.fartCd = HERO.fartCd;
  const h = game.hero;
  const radius = 180;
  for (const e of game.enemies) {
    const d = Math.hypot(e.x - h.x, e.y - h.y);
    if (d < radius) {
      e.hp -= 90;
      e.slowTimer = 3000;
      e.hitFlash = 0.2;
      if (e.hp <= 0) {
        const idx = game.enemies.indexOf(e);
        if (idx >= 0) { game.enemies.splice(idx, 1); game.gold += e.gold; updateUI(); }
      }
    }
  }
  game.effects.push({ type: 'fart', x: h.x, y: h.y, radius, time: 0, duration: 1200 });
  addParticles(h.x, h.y, '#8bc34a', 30);
  showBanner('💨 臭屁！');
}

function useRoar() {
  if (!game.hero || game.hero.hp <= 0) return;
  if (game.hero.roarCd > 0) return;
  game.hero.roarCd = HERO.roarCd;
  const h = game.hero;
  for (let i = game.enemies.length - 1; i >= 0; i--) {
    const e = game.enemies[i];
    e.hp -= 130;
    e.stunTimer = 2000;
    e.hitFlash = 0.3;
    if (e.hp <= 0) { game.enemies.splice(i, 1); game.gold += e.gold; }
  }
  updateUI();
  game.effects.push({ type: 'roar', x: h.x, y: h.y, time: 0, duration: 900 });
  addParticles(h.x, h.y, '#ffd700', 40);
  showBanner('🦁 狮子吼！');
}

/* =========================================================
   渲染
   ========================================================= */
function render() {
  const bgGrad = ctx.createRadialGradient(W/2, H*0.3, 0, W/2, H*0.5, Math.max(W, H)*0.8);
  bgGrad.addColorStop(0, '#5d8a3e');
  bgGrad.addColorStop(0.5, '#3a5a28');
  bgGrad.addColorStop(1, '#1e3015');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  ctx.globalAlpha = 0.35;
  for (let i = 0; i < 200; i++) {
    const x = ((i * 137.5) % W);
    const y = ((i * 73.3) % H);
    const hue = 100 + (i % 30);
    ctx.fillStyle = `hsl(${hue}, 40%, ${25 + (i % 20)}%)`;
    ctx.beginPath();
    ctx.arc(x, y, 1 + (i % 3), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  drawDecorations();
  drawPath();

  for (const spot of towerSpots) {
    if (spot.tower) continue;
    drawEmptySpot(spot.x, spot.y);
  }

  // 攻击炮塔
  for (const tower of game.towers) drawTower(tower);
  // 兵营
  for (const b of game.barracks) drawBarracks(b);
  // 兵营士兵
  for (const b of game.barracks) {
    for (const s of b.soldiers) drawSoldier(s);
  }
  // 敌人
  for (const e of game.enemies) drawEnemy(e);

  // 子弹
  for (const b of game.bullets) {
    if (b.isHero) {
      const angle = Math.atan2(b.target.y - b.y, b.target.x - b.x);
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(angle);
      ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-10, 0); ctx.lineTo(6, 0); ctx.stroke();
      ctx.fillStyle = '#fff8e1';
      ctx.beginPath();
      ctx.moveTo(6, 0); ctx.lineTo(2, -2); ctx.lineTo(2, 2); ctx.closePath(); ctx.fill();
      ctx.restore();
    } else {
      ctx.save();
      ctx.shadowColor = b.color; ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 5);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.5, b.color);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.fill();
      ctx.restore();
    }
  }

  // 英雄
  if (game.hero && game.hero.hp > 0) {
    drawHero(game.hero.x, game.hero.y, game.hero.angle, game.hero.hp / game.hero.maxHp);
  }

  // 粒子
  for (const p of game.particles) {
    const alpha = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = p.color; ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 技能特效
  for (const f of game.effects) {
    const t = f.time / f.duration;
    if (f.type === 'fart') {
      const r = f.radius * Math.min(1, t * 1.8);
      const alpha = (1 - t) * 0.8;
      for (let i = 0; i < 8; i++) {
        const angle = (i / 8) * Math.PI * 2 + t * 4;
        const cx = f.x + Math.cos(angle) * r * 0.55;
        const cy = f.y + Math.sin(angle) * r * 0.55;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 0.5);
        g.addColorStop(0, `rgba(180,230,120,${alpha})`);
        g.addColorStop(0.5, `rgba(120,180,80,${alpha * 0.6})`);
        g.addColorStop(1, 'rgba(60,120,40,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (f.type === 'roar') {
      const maxR = Math.max(W, H);
      for (let i = 0; i < 4; i++) {
        const r = (t * maxR * 1.2) - i * 50;
        if (r > 0) {
          const alpha = Math.max(0, 1 - t - i * 0.15);
          ctx.beginPath();
          ctx.arc(f.x, f.y, r, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(255,215,0,${alpha})`;
          ctx.lineWidth = 8 - i * 1.6;
          ctx.stroke();
        }
      }
    }
  }
}

/* =========================================================
   绘制函数
   ========================================================= */
function drawPath() {
  ctx.save();
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 56; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(pathPoints[0].x + 4, pathPoints[0].y + 4);
  for (let i = 1; i < pathPoints.length; i++) ctx.lineTo(pathPoints[i].x + 4, pathPoints[i].y + 4);
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = '#5d4037';
  ctx.lineWidth = 56; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(pathPoints[0].x, pathPoints[0].y);
  for (let i = 1; i < pathPoints.length; i++) ctx.lineTo(pathPoints[i].x, pathPoints[i].y);
  ctx.stroke();
  ctx.restore();

  ctx.save();
  const pathGrad = ctx.createLinearGradient(0, 0, 0, H);
  pathGrad.addColorStop(0, '#a1887f');
  pathGrad.addColorStop(1, '#6d4c41');
  ctx.strokeStyle = pathGrad;
  ctx.lineWidth = 44; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(pathPoints[0].x, pathPoints[0].y);
  for (let i = 1; i < pathPoints.length; i++) ctx.lineTo(pathPoints[i].x, pathPoints[i].y);
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = 'rgba(50,30,20,0.5)';
  ctx.lineWidth = 2;
  for (let i = 0; i < pathPoints.length - 1; i++) {
    const p1 = pathPoints[i], p2 = pathPoints[i+1];
    const segs = Math.floor(Math.hypot(p2.x-p1.x, p2.y-p1.y) / 22);
    const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
    const nx = Math.cos(angle + Math.PI/2);
    const ny = Math.sin(angle + Math.PI/2);
    for (let s = 0; s < segs; s++) {
      const t = s / segs;
      const x = p1.x + (p2.x - p1.x) * t;
      const y = p1.y + (p2.y - p1.y) * t;
      ctx.beginPath();
      ctx.moveTo(x + nx * 20, y + ny * 20);
      ctx.lineTo(x - nx * 20, y - ny * 20);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawEmptySpot(x, y) {
  ctx.beginPath();
  ctx.ellipse(x, y + 4, 22, 8, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x, y, 22, 0, Math.PI * 2);
  const g = ctx.createRadialGradient(x, y, 0, x, y, 22);
  g.addColorStop(0, 'rgba(255,215,0,0.05)');
  g.addColorStop(1, 'rgba(255,215,0,0.15)');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 5]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(255,215,0,0.85)';
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('+', x, y);
}

function drawDecorations() {
  for (const d of decorations) {
    if (d.type === 'tree') {
      ctx.beginPath();
      ctx.ellipse(d.x, d.y + 10 * d.size, 18 * d.size, 6 * d.size, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();
      ctx.fillStyle = '#5d4037';
      ctx.fillRect(d.x - 3 * d.size, d.y - 5 * d.size, 6 * d.size, 15 * d.size);
      const foliage = [
        { offset: 0, r: 16, color: '#2e7d32' },
        { offset: -6, r: 12, color: '#43a047' },
        { offset: -3, r: 9, color: '#66bb6a' }
      ];
      foliage.forEach(f => {
        ctx.beginPath();
        ctx.arc(d.x + f.offset * d.size, d.y - 15 * d.size + f.offset, f.r * d.size, 0, Math.PI * 2);
        ctx.fillStyle = f.color; ctx.fill();
      });
    } else if (d.type === 'stone') {
      ctx.beginPath();
      ctx.ellipse(d.x, d.y + 5 * d.size, 14 * d.size, 5 * d.size, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();
      ctx.beginPath();
      ctx.ellipse(d.x, d.y, 12 * d.size, 8 * d.size, 0, 0, Math.PI * 2);
      const sg = ctx.createRadialGradient(d.x - 3, d.y - 3, 0, d.x, d.y, 12 * d.size);
      sg.addColorStop(0, '#9e9e9e');
      sg.addColorStop(1, '#616161');
      ctx.fillStyle = sg; ctx.fill();
      ctx.strokeStyle = '#424242'; ctx.lineWidth = 1.5; ctx.stroke();
    } else {
      ctx.strokeStyle = '#388e3c';
      ctx.lineWidth = 2 * d.size; ctx.lineCap = 'round';
      for (let i = 0; i < 4; i++) {
        const angle = -Math.PI/2 + (i - 1.5) * 0.3;
        ctx.beginPath();
        ctx.moveTo(d.x, d.y + 5 * d.size);
        ctx.lineTo(d.x + Math.cos(angle) * 10 * d.size, d.y + 5 * d.size + Math.sin(angle) * 12 * d.size);
        ctx.stroke();
      }
    }
  }
}

function drawTower(tower) {
  const cfg = TOWER_TYPES[tower.type];
  const x = tower.x, y = tower.y;

  ctx.beginPath();
  ctx.ellipse(x, y + 8, 22, 8, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill();

  ctx.beginPath();
  ctx.arc(x, y, 20, 0, Math.PI * 2);
  const baseGrad = ctx.createRadialGradient(x - 5, y - 5, 0, x, y, 20);
  baseGrad.addColorStop(0, '#8d6e63');
  baseGrad.addColorStop(1, '#4e342e');
  ctx.fillStyle = baseGrad; ctx.fill();
  ctx.strokeStyle = '#3e2723'; ctx.lineWidth = 2; ctx.stroke();

  ctx.beginPath();
  ctx.arc(x, y, 15, 0, Math.PI * 2);
  const bodyGrad = ctx.createRadialGradient(x - 5, y - 5, 0, x, y, 15);
  bodyGrad.addColorStop(0, cfg.accent);
  bodyGrad.addColorStop(0.6, cfg.color);
  bodyGrad.addColorStop(1, '#1a1a1a');
  ctx.fillStyle = bodyGrad; ctx.fill();
  ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.stroke();

  ctx.save();
  ctx.translate(x, y); ctx.rotate(tower.angle || 0);
  ctx.fillStyle = '#000'; ctx.fillRect(3, -3, 22, 8);
  const barGrad = ctx.createLinearGradient(0, -4, 0, 4);
  barGrad.addColorStop(0, '#888');
  barGrad.addColorStop(0.5, '#ddd');
  barGrad.addColorStop(1, '#555');
  ctx.fillStyle = barGrad; ctx.fillRect(2, -4, 20, 6);
  ctx.fillStyle = '#222'; ctx.fillRect(20, -4, 3, 6);
  ctx.restore();

  ctx.beginPath();
  ctx.arc(x, y - 8, 5, 0, Math.PI * 2);
  const topGrad = ctx.createRadialGradient(x - 2, y - 10, 0, x, y - 8, 5);
  topGrad.addColorStop(0, '#fff');
  topGrad.addColorStop(1, cfg.accent);
  ctx.fillStyle = topGrad; ctx.fill();
  ctx.strokeStyle = '#333'; ctx.lineWidth = 1; ctx.stroke();

  ctx.font = '14px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(cfg.icon, x, y);

  if (tower.level > 1) {
    for (let i = 1; i < tower.level; i++) {
      ctx.beginPath();
      ctx.arc(x - 8 + i * 8, y - 22, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#ffd700'; ctx.fill();
      ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
    }
  }
}

/* ====== 兵营绘制 ====== */
function drawBarracks(b) {
  const x = b.x, y = b.y;
  const data = barracksLevelData(b.level);

  // 阴影
  ctx.beginPath();
  ctx.ellipse(x, y + 12, 26, 8, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fill();

  // 石基
  ctx.beginPath();
  ctx.arc(x, y, 22, 0, Math.PI * 2);
  const baseGrad = ctx.createRadialGradient(x - 5, y - 5, 0, x, y, 22);
  baseGrad.addColorStop(0, '#9e8a78');
  baseGrad.addColorStop(1, '#4e342e');
  ctx.fillStyle = baseGrad; ctx.fill();
  ctx.strokeStyle = '#3e2723'; ctx.lineWidth = 2; ctx.stroke();

  // 木屋主体
  ctx.beginPath();
  ctx.moveTo(x - 15, y + 2);
  ctx.lineTo(x - 15, y - 12);
  ctx.lineTo(x, y - 20);
  ctx.lineTo(x + 15, y - 12);
  ctx.lineTo(x + 15, y + 2);
  ctx.closePath();
  const wallGrad = ctx.createLinearGradient(x, y - 20, x, y + 2);
  wallGrad.addColorStop(0, '#a1887f');
  wallGrad.addColorStop(1, '#5d4037');
  ctx.fillStyle = wallGrad; ctx.fill();
  ctx.strokeStyle = '#3e2723'; ctx.lineWidth = 2; ctx.stroke();

  // 屋顶
  ctx.beginPath();
  ctx.moveTo(x - 18, y - 12);
  ctx.lineTo(x, y - 24);
  ctx.lineTo(x + 18, y - 12);
  ctx.closePath();
  const roofGrad = ctx.createLinearGradient(x, y - 24, x, y - 12);
  roofGrad.addColorStop(0, '#c62828');
  roofGrad.addColorStop(1, '#8b0000');
  ctx.fillStyle = roofGrad; ctx.fill();
  ctx.strokeStyle = '#4a0000'; ctx.lineWidth = 2; ctx.stroke();

  // 门
  ctx.beginPath();
  ctx.arc(x, y + 2, 5, Math.PI, 0);
  ctx.lineTo(x + 5, y + 2);
  ctx.lineTo(x - 5, y + 2);
  ctx.closePath();
  ctx.fillStyle = '#2c1810'; ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();

  // 旗帜
  ctx.strokeStyle = '#4e342e'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + 18, y - 12);
  ctx.lineTo(x + 18, y - 30);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + 18, y - 30);
  ctx.lineTo(x + 30, y - 26);
  ctx.lineTo(x + 18, y - 22);
  ctx.closePath();
  ctx.fillStyle = '#f44336'; ctx.fill();
  ctx.strokeStyle = '#8b0000'; ctx.lineWidth = 1; ctx.stroke();

  // 等级
  if (b.level > 1) {
    for (let i = 1; i < b.level; i++) {
      ctx.beginPath();
      ctx.arc(x - 8 + i * 8, y - 32, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#ffd700'; ctx.fill();
      ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
    }
  }

  // 士兵数量 / 重生状态
  const ratio = b.soldiers.length / data.maxSoldiers;
  ctx.font = 'bold 10px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (b.soldiers.length < data.maxSoldiers && b.respawnTimer > 0) {
    const sec = Math.ceil(b.respawnTimer / 1000);
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath();
    ctx.arc(x, y + 20, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd700';
    ctx.fillText(sec + 's', x, y + 20);
  }
}

function drawSoldier(s) {
  const x = s.x, y = s.y;
  if (s.hurtFlash > 0) {
    ctx.beginPath();
    ctx.arc(x, y, 20, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${s.hurtFlash})`; ctx.fill();
  }

  // 阴影
  ctx.beginPath();

  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill();

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(s.angle);

  // 盾牌
  ctx.beginPath();
  ctx.arc(-9, 0, 11, 0, Math.PI * 2);
  const sg = ctx.createRadialGradient(-12, -3, 0, -9, 0, 11);
  sg.addColorStop(0, '#b0bec5');
  sg.addColorStop(1, '#546e7a');
  ctx.fillStyle = sg; ctx.fill();
  ctx.strokeStyle = '#263238'; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath();
  ctx.arc(-9, 0, 5, 0, Math.PI * 2);
  ctx.fillStyle = '#ffd700'; ctx.fill();

  // 剑
  ctx.fillStyle = '#cfd8dc';
  ctx.fillRect(7, -2, 15, 4);
  ctx.fillStyle = '#795548';
  ctx.fillRect(4, -3, 4, 6);

  // 身体
  ctx.beginPath();

  bodyG.addColorStop(0.7, '#78909c');
  bodyG.addColorStop(1, '#37474f');
  ctx.fillStyle = bodyG; ctx.fill();
  ctx.strokeStyle = '#263238'; ctx.lineWidth = 2; ctx.stroke();

  // 头盔
  ctx.beginPath();

  // 眼睛

}

function drawEnemy(e) {
  const t = ENEMY_TYPES[e.type];
  const wobble = Math.sin(e.wobble) * 0.15;

  ctx.beginPath();
  ctx.ellipse(e.x, e.y + e.size * 0.9, e.size * 0.95, e.size * 0.35, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fill();

  ctx.save();
  ctx.translate(e.x, e.y); ctx.rotate(wobble);

  const bodyGrad = ctx.createRadialGradient(-e.size*0.3, -e.size*0.3, 0, 0, 0, e.size);
  let bodyColor = t.body;
  let highlightColor = lighten(t.body, 40);
  if (e.hitFlash > 0) { bodyColor = '#ffffff'; highlightColor = '#ffffff'; }
  else if (e.stunTimer > 0) { bodyColor = '#ffeb3b'; highlightColor = '#fff59d'; }
  else if (e.slowTimer > 0) { bodyColor = '#81d4fa'; highlightColor = '#b3e5fc'; }
  bodyGrad.addColorStop(0, highlightColor);
  bodyGrad.addColorStop(0.7, bodyColor);
  bodyGrad.addColorStop(1, t.dark);
  ctx.beginPath();
  ctx.arc(0, 0, e.size, 0, Math.PI * 2);
  ctx.fillStyle = bodyGrad; ctx.fill();
  ctx.strokeStyle = t.dark; ctx.lineWidth = 2; ctx.stroke();

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-e.size * 0.3, -e.size * 0.2, e.size * 0.26, 0, Math.PI * 2);
  ctx.arc(e.size * 0.3, -e.size * 0.2, e.size * 0.26, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-e.size * 0.3 + 1, -e.size * 0.2, e.size * 0.13, 0, Math.PI * 2);
  ctx.arc(e.size * 0.3 + 1, -e.size * 0.2, e.size * 0.13, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  if (e.type === 'demon') ctx.arc(0, e.size * 0.3, e.size * 0.4, 0, Math.PI);
  else { ctx.moveTo(-e.size * 0.3, e.size * 0.35); ctx.lineTo(e.size * 0.3, e.size * 0.35); }
  ctx.stroke();

  ctx.restore();

  drawHealthBar(e.x, e.y - e.size - 12, e.size * 2.2, 4, e.hp / e.maxHp);

  if (e.stunTimer > 0) {
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('💫', e.x, e.y - e.size - 20);
  }
}

function lighten(hex, amount) {
  hex = hex.replace('#', '');
  const r = Math.min(255, parseInt(hex.substr(0, 2), 16) + amount);
  const g = Math.min(255, parseInt(hex.substr(2, 2), 16) + amount);
  const b = Math.min(255, parseInt(hex.substr(4, 2), 16) + amount);
  return `rgb(${r},${g},${b})`;
}

function drawHealthBar(x, y, w, h, ratio) {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(x - w/2 - 1, y - 1, w + 2, h + 2);
  let color = '#4caf50';
  if (ratio < 0.5) color = '#ff9800';
  if (ratio < 0.25) color = '#f44336';
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, lighten(color, 40));
  g.addColorStop(1, color);
  ctx.fillStyle = g;
  ctx.fillRect(x - w/2, y, w * Math.max(0, ratio), h);
}

   交互
   ========================================================= */
let touchStartX = 0, touchStartY = 0, touchStartTime = 0;

canvas.addEventListener('touchstart', (e) => {
  const t = e.changedTouches[0];
  touchStartX = t.clientX; touchStartY = t.clientY;
  touchStartTime = Date.now();
}, { passive: true });

canvas.addEventListener('touchend', (e) => {
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX, dy = t.clientY - touchStartY;
  if (Math.hypot(dx, dy) > 15) return;
  if (Date.now() - touchStartTime > 500) return;
  handleTap(t.clientX, t.clientY);
}, { passive: true });

canvas.addEventListener('click', (e) => {
  if ('ontouchstart' in window) return;
  handleTap(e.clientX, e.clientY);
});

function handleTap(x, y) {
  if (!game.running || game.paused) return;

  for (const spot of towerSpots) {
    if (Math.hypot(spot.x - x, spot.y - y) < 28) {
      if (spot.tower) {
        upgradeTower(spot);
      } else if (game.selectedType) {
        if (TOWER_TYPES[game.selectedType]) buildTower(spot, game.selectedType);
        else if (game.selectedType === 'barracks') buildBarracks(spot);
      }
      return;
    }
  }

  game.selectedType = null;
  document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('selected'));
}

function buildTower(spot, type) {
  const cfg = TOWER_TYPES[type];
  if (game.gold < cfg.cost) { showBanner('💰 金币不足'); return; }
  game.gold -= cfg.cost;
  const tower = { x: spot.x, y: spot.y, type, angle: -Math.PI/2, cooldown: 0, level: 1 };
  spot.tower = tower;
  game.towers.push(tower);
  addParticles(spot.x, spot.y, cfg.accent, 20);
  updateUI();
  game.selectedType = null;
  document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('selected'));
}

function buildBarracks(spot) {
  if (game.gold < BARRACKS.cost) { showBanner('💰 金币不足'); return; }
  game.gold -= BARRACKS.cost;
  const barracks = {
    x: spot.x, y: spot.y, type: 'barracks',
    level: 1, soldiers: [], respawnTimer: 0
  };
  spot.tower = barracks;
  game.barracks.push(barracks);
  // 立即生成第一批士兵
  const data = barracksLevelData(1);
  for (let i = 0; i < data.maxSoldiers; i++) {
    barracks.soldiers.push(createSoldier(barracks));
  }
  addParticles(spot.x, spot.y, BARRACKS.accent, 25);
  updateUI();
  game.selectedType = null;
  document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('selected'));
}

function upgradeTower(spot) {
  const t = spot.tower;
  if (t.type === 'barracks') {
    if (t.level >= 3) { showBanner('⭐ 已满级'); return; }
    const cost = 60 * t.level;
    if (game.gold < cost) { showBanner('💰 金币不足'); return; }
    game.gold -= cost;
    t.level++;
    const data = barracksLevelData(t.level);
    // 加强现有士兵
    for (const s of t.soldiers) {
      s.maxHp = data.hp;
      s.hp = data.hp;
      s.damage = data.damage;
    }
    addParticles(t.x, t.y, '#ffd700', 15);
    updateUI();
    showBanner(`⬆️ 兵营 ${t.level} 级`);
  } else {
    if (t.level >= 3) { showBanner('⭐ 已满级'); return; }
    const cost = 50 * t.level;
    if (game.gold < cost) { showBanner('💰 金币不足'); return; }
    game.gold -= cost;
    t.level++;
    addParticles(t.x, t.y, '#ffd700', 15);
    updateUI();
    showBanner(`⬆️ ${TOWER_TYPES[t.type].name} ${t.level} 级`);
  }
}

/* =========================================================
   虚拟摇杆
   ========================================================= */
const joyWrap = document.getElementById('joystickWrap');
const joyKnob = document.getElementById('joystickKnob');
let joyTouchId = null;
let joyCenterX = 0, joyCenterY = 0;

joyWrap.addEventListener('touchstart', (e) => {
  e.stopPropagation(); e.preventDefault();
  const t = e.changedTouches[0];
  joyTouchId = t.identifier;
  const rect = joyWrap.getBoundingClientRect();
  joyCenterX = rect.left + rect.width / 2;
  joyCenterY = rect.top + rect.height / 2;
  joystick.active = true;
  updateJoy(t.clientX, t.clientY);
}, { passive: false });

document.addEventListener('touchmove', (e) => {
  if (joyTouchId === null) return;
  for (const t of e.changedTouches) {
    if (t.identifier === joyTouchId) {
      updateJoy(t.clientX, t.clientY);
      e.preventDefault();
    }
  }
}, { passive: false });

document.addEventListener('touchend', (e) => {
  for (const t of e.changedTouches) {
    if (t.identifier === joyTouchId) {
      joyTouchId = null;
      joystick.active = false;
      joystick.dx = 0; joystick.dy = 0;
      joyKnob.style.transform = 'translate(-50%,-50%)';
    }
  }
});

document.addEventListener('touchcancel', (e) => {
  for (const t of e.changedTouches) {
    if (t.identifier === joyTouchId) {
      joyTouchId = null;
      joystick.active = false;
      joystick.dx = 0; joystick.dy = 0;
      joyKnob.style.transform = 'translate(-50%,-50%)';
    }
  }
});

function updateJoy(x, y) {
  const dx = x - joyCenterX;
  const dy = y - joyCenterY;
  const maxDist = 50;
  const dist = Math.hypot(dx, dy);
  const clamped = Math.min(dist, maxDist);
  const ratio = dist > 0 ? clamped / dist : 0;
  const kx = dx * ratio;
  const ky = dy * ratio;
  joyKnob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
  joystick.dx = kx / maxDist;
  joystick.dy = ky / maxDist;
}

});

document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('startScreen').style.display = 'none';
  resetGame();
});

/* =========================================================
   重置 / 结束
   ========================================================= */
function resetGame() {
  game.phase = 'prepare';
  game.paused = false;
  game.gold = 300;
  game.hp = 20;
  game.wave = 0;
  game.enemies = [];
  game.towers = [];
  game.barracks = [];
  game.bullets = [];
  game.particles = [];
  game.effects = [];
  game.selectedType = null;
  game.waveInProgress = false;
  game.enemiesToSpawn = 0;
  game.spawnTimer = 0;
  game.running = true;
  game.time = 0;
  game.hero = createHero();

  for (const s of towerSpots) s.tower = null;

  joystick.active = false; joystick.dx = 0; joystick.dy = 0;
  joyKnob.style.transform = 'translate(-50%,-50%)';

  document.getElementById('pauseOverlay').classList.remove('show');
  document.getElementById('pauseBtn').classList.remove('active');
  document.getElementById('startWaveBtn').classList.remove('hidden');
  document.getElementById('startWaveBtn').textContent = '开始第1波';
  document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('selected'));

  updateUI();
  showBanner('准备阶段');
}

function endGame(win) {
  game.running = false;
  const b = document.getElementById('banner');
  b.textContent = win ? '🎉 胜利！王国安全了！' : '💀 城堡被攻破...';
  b.classList.remove('show');
  void b.offsetWidth;
  b.classList.add('show');
  setTimeout(() => {
    if (confirm(win ? '恭喜通关！是否重新开始？' : '游戏结束。是否重新开始？')) {
      resetGame();
    }
  }, 1800);
}

/* =========================================================
   主循环
   ========================================================= */
let lastTime = performance.now();
function loop(time) {
  const dt = Math.min(time - lastTime, 50);
  lastTime = time;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
